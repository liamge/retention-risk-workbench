data:
  dataset_type: kkbox
  feature_path: data/processed/kkbox_features_duckdb_cleaned_train.parquet
  target_col: is_churn
  sample_frac: 0.1        # downsample for local training; adjust as needed
  sample_random_state: 42

split:
  strategy: random
  random_state: 42
  train_size: 0.70
  dev_size: 0.15

models:
  logistic_regression:
    max_iter: 2000

  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1
    reg_lambda: 1.0

  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 64
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_samples: 20
    reg_lambda: 1.0

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  experiment_name: kkbox-churn

artifacts:
  dir: artifacts/kkbox

tuning:
  n_trials: 30
  objective_metric: roc_auc
  algorithm: lightgbm  # options: xgboost, lightgbm
